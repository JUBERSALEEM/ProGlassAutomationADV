# ─────────────────────────────────────────────────────────────────────
# ProGlass Automation — RELEASE pipeline template (Docs/CI/release.yml)
#
# ACTIVATION (one-time, like build.yml):
#   copy this file to  .github/workflows/release.yml
#
# TRIGGER: intentionally pushing a version tag (v2.0.1, v2.1.0 …).
# Normal pushes NEVER create releases.
#
# PHASE 1 (active today): build → publish → zip → GitHub Release.
# PHASE 2 (enable after Velopack lands): the marked Velopack block
# replaces the zip with proper delta-update packages (nupkg + Setup).
# ─────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, package & publish
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProGlassAutomation.csproj

      - name: Build (Release)
        run: dotnet build ProGlassAutomation.csproj -c Release --no-restore

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish ProGlassAutomation.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish/

      # ── PHASE 1 artifact: portable zip ──────────────────────────────
      - name: Package (zip)
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"          # e.g. v2.0.1
          $name = "ProGlassAutomation-$tag-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name
          echo "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── PHASE 2 (Velopack — active) ────────────────────────────────
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Velopack pack
        shell: pwsh
        run: >
          vpk pack --packId ProGlassAutomation
          --packVersion $("${{ github.ref_name }}".TrimStart('v'))
          --packDir publish --packTitle "ProGlass Automation"
          --packAuthors "Juber Saleem" --outputDir releases

      - name: Velopack publish to GitHub Releases
        run: >
          vpk publish github --repoUrl
          https://github.com/${{ github.repository }}
          --packDir releases --pre false --tag ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

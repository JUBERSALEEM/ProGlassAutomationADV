# ═══════════════════════════════════════════════════════════════════════════
# dotnet-desktop.yml — ProGlass Automation
#
# ⚠️  WHY THIS FILE LIVES IN docs/ci/ AND NOT .github/workflows/
# ─────────────────────────────────────────────────────────────────
# The GitHub App that pushes from this development sandbox does NOT have
# the `workflows` permission scope, so any push that creates or modifies a
# file under `.github/workflows/` is rejected with:
#     "refusing to allow a GitHub App to create or update workflow
#      `.github/workflows/dotnet-desktop.yml` without `workflows`
#      permission"
#
# To work around this (without disabling the safety), the canonical copy of
# this workflow lives here. To activate it, a maintainer with admin rights
# copies this file into `.github/workflows/dotnet-desktop.yml` (one command —
# see docs/CI.md, "Activating the workflow"). The contents below are exactly
# what should live in `.github/workflows/`, so the workflow behaves the same.
#
# If/when the App's installation is later granted the `workflows` scope, the
# canonical location should move back to `.github/workflows/dotnet-desktop.yml`
# and this header stripped.
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# ProGlass Automation — .NET Desktop publish + OTA release pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Runs on Windows (the WPF app targets net8.0-windows and cannot build on
# the Ubuntu runners used by the old dotnet.yml).
#
# Two jobs:
#   build-test   restore -> build (Release) -> xUnit test gate.
#                Runs on every push, every PR, and every manual dispatch.
#   release      only on a version tag (v*.*.*) or a manual workflow_dispatch:
#                  1. dotnet publish   (self-contained win-x64, Release.pubxml)
#                  2. Authenticode sign (optional — CODESIGN_PFX_* secrets)
#                  3. vpk pack         (Setup.exe + full/delta .nupkg + portable)
#                  4. vpk upload github -> publishes the Velopack feed as a
#                     GitHub Release. THIS is what the in-app OTA reads.
#
# OTA wiring (why this file exists):
#   * VelopackUpdateService -> GithubSource("JUBERSALEEM/ProGlassAutomationADV")
#     consumes the RELEASES feed that `vpk upload github` publishes.
#   * The feed channel is "stable" (installer/velopack.json). It MUST be passed
#     to vpk download/pack/upload — never left at the default "win" — or the
#     in-app updater will look in the wrong channel and report "no update".
#
# Versioning (single source of truth): <Version> in ProGlassAutomation.csproj.
# A tag vX.Y.Z must equal that value or the release job fails; the resolved
# version is then stamped into Version / AssemblyVersion / FileVersion so the
# built binary and the release always agree.
#
# Code-signing secrets (Settings -> Secrets and variables -> Actions):
#   CODESIGN_PFX_BASE64    base64 of the .pfx code-signing certificate
#   CODESIGN_PFX_PASSWORD  its password
# Without them the build is published unsigned. The desktop updater's
# Authenticode check will then refuse the update (safe for internal testing —
# never ship unsigned builds to customers).
# ─────────────────────────────────────────────────────────────────────────────

name: .NET Desktop (publish + OTA release)

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (MAJOR.MINOR.PATCH). Leave empty to use <Version> from ProGlassAutomation.csproj."
        required: false
        default: ""
      prerelease:
        description: "Publish as a pre-release (excluded from the stable OTA feed)"
        type: boolean
        required: false
        default: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Pinned to match the Velopack 1.2.0 NuGet library referenced by
  # ProGlassAutomation.csproj, so the CLI writes a RELEASES feed the app reads.
  VPK_VERSION: "1.2.0"
  VPK_CHANNEL: "stable"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Gate: build + test on Windows. Runs for every push / PR / manual dispatch.
  # ────────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build + test
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: build-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Build the TEST project (not the app project) so the test DLL is
      # produced in the same step: the test project has a ProjectReference on
      # the app, and the app csproj has <Compile Remove="Tests/**" />. Building
      # the app directly would skip the test project and make the
      # `dotnet test --no-build` step below fail with "test source not found".
      - name: Restore
        run: dotnet restore Tests/ProGlassAutomation.Tests.csproj --verbosity minimal

      - name: Build (Release)
        run: >
          dotnet build Tests/ProGlassAutomation.Tests.csproj
          -c Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test Tests/ProGlassAutomation.Tests.csproj
          -c Release
          --no-build
          --verbosity normal

  # ────────────────────────────────────────────────────────────────────────────
  # Release: publish + sign + Velopack pack + GitHub Release (OTA feed).
  # Only on a version tag or an explicit manual dispatch — normal pushes never
  # create releases (see docs/OTA.md).
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish + OTA release
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # required for vpk to create the GitHub Release + upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $csproj = Get-Content ProGlassAutomation.csproj -Raw
          $m = [regex]::Match($csproj, '<Version>(?<v>[^<]+)</Version>')
          $csprojVersion = if ($m.Success) { $m.Groups['v'].Value.Trim() } else { '' }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          }
          elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION.TrimStart('v', 'V')
          }
          else {
            $version = $csprojVersion
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Resolved version '$version' is not a valid MAJOR.MINOR.PATCH version."
            exit 1
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $csprojVersion -and $csprojVersion -ne $version) {
            Write-Host "::error::Tag '$env:GITHUB_REF_NAME' ($version) does not match <Version>$csprojVersion</Version> in ProGlassAutomation.csproj. Bump the csproj, commit, and re-tag."
            exit 1
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing ProGlass Automation $version (tag v$version, channel $env:VPK_CHANNEL)"

      - name: Restore (win-x64)
        run: dotnet restore ProGlassAutomation.csproj -r win-x64 --verbosity minimal

      # Self-contained win-x64 via the shared Release.pubxml profile; the
      # resolved version is stamped into Version / AssemblyVersion / FileVersion
      # so the shipped binary identity always matches the release tag.
      - name: Publish (self-contained win-x64)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $v = $env:APP_VERSION
          $assemblyVersion = '{0}.0' -f $v
          $fileVersion     = '{0}.0' -f $v

          if (Test-Path publish) { Remove-Item -Recurse -Force publish }

          dotnet publish ProGlassAutomation.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishProfile=Release `
            -o publish `
            -p:Version=$v `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$fileVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Authenticode-sign the published binaries before packing so the Setup.exe
      # payload and the portable package carry valid signatures. Skipped
      # gracefully when no code-signing certificate is configured.
      - name: Sign binaries (Authenticode, optional)
        shell: pwsh
        env:
          PFX_CERT: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_CERT)) {
            Write-Host "::warning::No code-signing certificate configured — publishing unsigned (the in-app updater will refuse it; fine for internal testing)."
          }
          else {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_CERT))
            Get-ChildItem -Recurse -Path publish -Include *.exe,*.dll | ForEach-Object {
              & signtool sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      # Package the publish tree with Velopack and publish the resulting feed
      # as a GitHub Release. The install + download + pack + upload happen in
      # one step so the freshly installed vpk CLI is on PATH for every command.
      - name: Package + publish Velopack OTA feed
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          APP_TAG: ${{ steps.version.outputs.TAG }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install --global vpk --version $env:VPK_VERSION

          $repo = "https://github.com/$env:GITHUB_REPOSITORY"

          # Download the previous release so vpk can compute deltas and extend
          # the RELEASES feed. Best-effort: the very first release has nothing
          # to download, so a failure here is expected and harmless.
          vpk download github --repoUrl $repo --channel $env:VPK_CHANNEL --outputDir releases
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::No previous release found — building a full package without deltas (first release?)."
          }
          $LASTEXITCODE = 0

          # Package: Setup.exe + full/delta .nupkg + portable package + RELEASES.
          vpk pack `
            --packId      ProGlassAutomation `
            --packVersion $env:APP_VERSION `
            --packDir     publish `
            --outputDir   releases `
            --packTitle   "ProGlass Automation" `
            --packAuthors "Juber Saleem" `
            --icon        favicon.ico `
            --channel     $env:VPK_CHANNEL `
            --mainExe     ProGlassAutomation.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Publish the feed as a GitHub Release. This is the step that
          # "connects the OTA with GitHub Releases": VelopackUpdateService's
          # GithubSource reads the RELEASES file uploaded here on launch.
          if ($env:IS_PRERELEASE -eq 'true') {
            vpk upload github `
              --repoUrl $repo --channel $env:VPK_CHANNEL --outputDir releases `
              --publish --pre `
              --releaseName "ProGlass Automation $env:APP_VERSION" `
              --tag $env:APP_TAG
          }
          else {
            vpk upload github `
              --repoUrl $repo --channel $env:VPK_CHANNEL --outputDir releases `
              --publish `
              --releaseName "ProGlass Automation $env:APP_VERSION" `
              --tag $env:APP_TAG
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# ═══════════════════════════════════════════════════════════════════════════
# SUPERSEDED — 2026-10-05. This file is no longer a workflow template.
# ═══════════════════════════════════════════════════════════════════════════
#
# This was the most accurate of the four templates, and it is the one the
# live workflows are descended from. It now lives, split by trigger, at:
#
#     .github/workflows/ci.yml       (its build-test job, plus static checks
#                                     and the two portable test projects)
#     .github/workflows/release.yml  (its release job: version from the
#                                     csproj, vpk 1.2.0, --channel stable,
#                                     feed published to GitHub Releases)
#
# Kept as a comment-only file rather than deleted because seven documents
# link to it, including audits written before CI existed. Two copies of a
# workflow is how this repository accumulates drift, so the executable
# content is gone; only this pointer remains.
#
# What the live release job does differently, and why
# ─────────────────────────────────────────────────────────────────────────
#   * It no longer inlines `dotnet publish` + `vpk pack`. It calls
#     `scripts/build-installer.ps1` — the same script a developer runs — so
#     there is one declaration of what a release contains (publish through
#     Release.pubxml, strip PRODUCTION_READINESS, bundle FFmpeg, paint the
#     splash and MSI art, pack, portable zip, SHA-256 summary). This template
#     re-implemented a subset of that inline, which is how the CI package and
#     the locally built package were able to differ.
#   * Code signing is therefore NOT wired: the script has no signing
#     passthrough. A CI release is unsigned, exactly like a local run. This
#     template's `--signParams` approach is still the right one and is
#     recorded as an open item — signing must happen DURING pack, because a
#     post-pack signtool pass misses the Setup.exe/Update.exe that vpk
#     generates and invalidates the feed checksums.
#   * No delta packages: the script clears `releases\` immediately before
#     packing, and deltas are computed from packages already in the output
#     directory, so this template's `vpk download github` step cannot feed
#     it. Every update downloads the full package.
#   * The tag/`<Version>` agreement check is kept verbatim, because a
#     mislabelled package is either unreachable by OTA (UpdateService.IsNewer
#     is a strict greater-than compare) or silently skips a release.
#
# The handbook is `docs/CI.md`.

# ═══════════════════════════════════════════════════════════════════════════
# SUPERSEDED — 2026-10-05. This file is no longer a workflow template.
# ═══════════════════════════════════════════════════════════════════════════
#
# The live workflow is now at:
#
#     .github/workflows/ci.yml
#
# This file used to be the canonical copy that a maintainer was asked to
# `cp` into `.github/workflows/`. That arrangement existed because the GitHub
# App pushing from the development sandbox did not have the `workflows`
# permission scope, and because two copies of a workflow is exactly the
# "one declaration stated twice" defect class this repository keeps finding in
# itself. Now that the workflow is activated in place, the copy is gone rather
# than left here to drift.
#
# It is kept as an empty file — rather than deleted — because twelve
# documents link to it, including the September 2026 audits that describe the
# state of CI at the time they were written. `scripts/verify-readmes.py`
# fails the build on a broken relative link, and those links should keep
# resolving to something that explains itself.
#
# What changed between this template and the live workflow
# ─────────────────────────────────────────────────────────
#   * This template restored and built `ProGlassAutomation.csproj` and then
#     ran `dotnet test Tests/... --no-build`. The app csproj carries
#     <Compile Remove="Tests/**" />, so the test project was never compiled
#     and the test step could only end in "test source file not found".
#     Fixed here first, then carried into the live workflow: the live job
#     builds `Tests/ProGlassAutomation.Tests.csproj`, which compiles the app
#     through the ProjectReference.
#   * The live workflow adds the two test projects this template never
#     reached — `Licensing/ProGlass.Licensing.Tests` and
#     `Tools/EngineRegression`, neither of which is in
#     `ProGlassAutomation.slnx`.
#   * The live workflow adds the SDK-free Python verifiers (docs links,
#     docs index freshness, brace balance) as a separate Ubuntu job, so a
#     stale docs index fails a push instead of waiting to be noticed.
#
# To see the pipeline: `.github/workflows/ci.yml` (verification gate) and
# `.github/workflows/release.yml` (tag-triggered OTA release). The handbook
# is `docs/CI.md`.

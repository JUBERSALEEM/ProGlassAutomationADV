# ═══════════════════════════════════════════════════════════════════════════
# SUPERSEDED — 2026-10-05. This file is no longer a workflow template.
# ═══════════════════════════════════════════════════════════════════════════
#
# The live verification gate is:
#
#     .github/workflows/ci.yml
#
# Kept as a comment-only file rather than deleted because ten documents
# reference it.
#
# This one was not broken — unlike `docs/ci/build-test.yml`, it ran
# `dotnet test` WITHOUT `--no-build`, so the test project did get compiled and
# the suite did run. It is superseded for three smaller reasons:
#
#   1. IT BUILT THE APP TWICE. `dotnet build ProGlassAutomation.csproj`
#      followed by `dotnet test Tests/...` (no `--no-build`) compiles the app
#      once, then compiles it again through the test project's
#      ProjectReference. The live workflow builds the test project only and
#      then tests with `--no-build`, which is both faster and the sequence the
#      installer script already documents as correct.
#   2. IT NEVER REACHED TWO PROJECTS. `Licensing/ProGlass.Licensing.Tests`
#      and `Tools/EngineRegression` are in no solution file at all
#      (`ProGlassAutomation.slnx` omits EngineRegression entirely), so
#      nothing compiled them. Both are portable net8.0 and both now run on
#      Ubuntu in the live workflow, minutes before the Windows job finishes.
#   3. NO NON-COMPILE CHECKS. The repository ships its own Python verifiers —
#      docs links, docs-index freshness, folder-README navigation and a
#      string/comment-aware brace scan — and none of them ran anywhere. They
#      are the checks that catch a stale index or a truncated file, and they
#      cost seconds.
#
# Its "53 test files" claim was also wrong: the suite is 288 files with 2,369
# `[Fact]`/`[Theory]` members. That was corrected here before the file was
# retired.

# Release workflow moved to .github/workflows/release.yml.
# This file is retained as a pointer for older documentation links.
# The active workflow builds and tests ProGlass Automation, publishes a
# signed single-file win-x64 EXE and checksum to GitHub Releases, preserves
# Velopack assets for installed-client OTA, and builds the License Generator
# only as a private, short-lived GitHub Actions artifact.
#
# Required private repository Actions secrets:
#   CODESIGN_PFX_BASE64
#   CODESIGN_PFX_PASSWORD
#
# A pushed vMAJOR.MINOR.PATCH tag must match <Version> in
# ProGlassAutomation.csproj. See docs/OTA.md for the complete release contract.

# ─────────────────────────────────────────────────────────────────────
# ProGlass Automation — RELEASE pipeline template (Phase 10: production
# hardening)
#
# ACTIVATION (one-time): copy this file to  .github/workflows/release.yml
# (the Arena sandbox cannot push into .github/workflows/ — see OTA.md).
#
# TRIGGER: pushing a version tag (v2.0.1, v2.1.0 …). Normal pushes never
# create releases.
#
# What it does:
#   1. Build (Release) → test gate → publish self-contained win-x64
#   2. Authenticode-sign the published binaries when a code-signing
#      certificate is configured (CODESIGN_PFX_BASE64 + password secrets).
#      This is what the desktop app's OTA signature verification
#      (UpdateSignatureVerifier / WinVerifyTrust) checks before install.
#   3. Package + create the GitHub Release (Velopack delta packages and a
#      portable zip), and publish to GitHub Releases.
#
# One-time setup (repository secrets, Settings → Secrets and variables):
#   CODESIGN_PFX_BASE64    base64 of the .pfx code-signing certificate
#   CODESIGN_PFX_PASSWORD  password for that .pfx
# If those secrets are absent the signing step is skipped and the release
# is published unsigned (the app's updater will then refuse it — expected
# and safe).
# ─────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, package & publish
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProGlassAutomation.csproj

      - name: Build (Release)
        run: dotnet build ProGlassAutomation.csproj -c Release --no-restore

      - name: Test (gate before release)
        run: >
          dotnet test Tests/ProGlassAutomation.Tests.csproj -c Release

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish ProGlassAutomation.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish/

      # ── Authenticode signing (Phase 10) ─────────────────────────────
      # Sign every .exe/.dll so the shipped updater's signature check
      # passes. Skipped gracefully when no certificate is configured.
      - name: Sign application binaries (Authenticode)
        shell: pwsh
        env:
          PFX_CERT: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_CERT)) {
            Write-Host "No code-signing certificate configured — skipping Authenticode signing."
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_CERT))
            Get-ChildItem -Recurse -Path publish -Include *.exe,*.dll | ForEach-Object {
              & signtool sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
          }

      # ── Package: portable zip ───────────────────────────────────────
      - name: Package (zip)
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $name = "ProGlassAutomation-$tag-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $name
          echo "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Velopack delta packages + publish ───────────────────────────
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Velopack pack
        shell: pwsh
        run: >
          vpk pack --packId ProGlassAutomation
          --packVersion $("${{ github.ref_name }}".TrimStart('v'))
          --packDir publish --packTitle "ProGlass Automation"
          --packAuthors "Juber Saleem" --outputDir releases

      - name: Velopack publish to GitHub Releases
        run: >
          vpk publish github --repoUrl
          https://github.com/${{ github.repository }}
          --packDir releases --pre false --tag ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

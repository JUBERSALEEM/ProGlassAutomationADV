# ProGlass SaaS — nginx top-level config (Phase 27).
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.yml.
# Site blocks live in conf.d/proglass.conf.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The API logs structured events itself; nginx access logs stay on
    # (ship them with the API logs — SAAS_DEPLOYMENT.md §7).
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    # Compression for the API's JSON payloads + (Phase 28) SPA assets.
    # TLS-terminating proxies should NOT compress TLS responses without
    # BREACH-awareness; with plain HTTP internally this is safe.
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Second-layer credential throttling (the API's
    # LoginRateLimitMiddleware is per-instance per-IP; this zone covers
    # the whole edge and every replica).
    limit_req_zone $binary_remote_addr zone=auth_edge:10m rate=10r/m;
    limit_req_status 429;

    # The SPA's static assets (Phase 28 mounts the built frontend here).
    # A holding page ships today — see conf.d/proglass.conf.
    include /etc/nginx/conf.d/*.conf;
}

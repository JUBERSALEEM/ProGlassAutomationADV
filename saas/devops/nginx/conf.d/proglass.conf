#     server_name pglass.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/pglass.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/pglass.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # … then copy the /health, /api/ and / blocks above verbatim.

# ProGlass SaaS — the edge (Phase 27).
#
# Topology:  client ─ nginx (this file) ─ api:8080 (Kestrel)
#            client ─ nginx ─ static SPA root (Phase 28)
#
# The API applies its own security headers, exception envelope and
# per-IP login rate limiting; nginx adds TLS termination, the body-size
# guard, generous read timeouts (optimization runs are synchronous
# requests that can take minutes) and the static root.

upstream pglass_api {
    server api:8080;
    keepalive 32;
}

# ── HTTP → (redirect to HTTPS when TLS is enabled) ────────────────────
server {
    listen 80;
    server_name _;

    # With TLS enabled (see the 443 block below) uncomment the redirect
    # and close port 80 to content:
    # return 301 https://$host$request_uri;

    # Liveness for external monitors — passthrough, no logging noise.
    location = /health {
        proxy_pass http://pglass_api;
        proxy_http_version 1.1;
        access_log off;
    }

    # The API (controllers are rooted at /api/v1/...).
    location /api/ {
        limit_req zone=auth_edge burst=20 nodelay;
        client_max_body_size 12m;      # 10 MB attachment limit + multipart overhead
        proxy_pass http://pglass_api;  # full URI preserved (/api/v1/…)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;       # synchronous optimization runs
        proxy_send_timeout 120s;
    }

    # The SPA (Phase 28). Until the frontend image lands, this serves a
    # clearly-labelled holding page — the API is fully reachable, the
    # web UI is the next phase. Swap the root to the built SPA bundle.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# ── HTTPS (enable when certificates exist) ────────────────────────────
# Certbot flow (bare metal / VM):
#   sudo certbot --nginx -d pglass.example.com
# or with compose, mount /etc/letsencrypt and uncomment:

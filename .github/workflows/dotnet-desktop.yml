name: ProGlassAutomation Build

on:
  push:
    branches: [ "new" ]
  pull_request:
    branches: [ "new" ]

permissions:
  contents: write

jobs:

  build:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore ProGlassAutomation NuGet Packages
      shell: pwsh
      run: |
        dotnet restore ProGlassAutomation.csproj

    - name: Publish ProGlassAutomation Standalone Binary
      shell: pwsh
      run: |
        dotnet publish ProGlassAutomation.csproj `
          --configuration Release `
          --output publish `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=false

    - name: Zip Standalone Application for Embed
      shell: pwsh
      run: |
        # Create zip payload from published binaries
        Compress-Archive -Path publish\* -DestinationPath Setup/ProGlassAutomation.Installer/payload.zip -Force
        Get-Item Setup/ProGlassAutomation.Installer/payload.zip

    - name: Restore ProGlassAutomation.Installer NuGet Packages
      shell: pwsh
      run: |
        dotnet restore Setup/ProGlassAutomation.Installer/ProGlassAutomation.Installer.csproj

    - name: Publish Custom WPF Installer Package
      shell: pwsh
      run: |
        dotnet publish Setup/ProGlassAutomation.Installer/ProGlassAutomation.Installer.csproj `
          --configuration Release `
          --output setup_publish `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=false

    - name: Prepare Setup.exe Artifact
      shell: pwsh
      run: |
        mkdir dist
        cp setup_publish/ProGlassAutomation-Setup.exe dist/ProGlassAutomation-Setup.exe
        ls dist

    - name: Upload Setup.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProGlassAutomation-Setup
        path: dist/ProGlassAutomation-Setup.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: ProGlass Automation v1.0.${{ github.run_number }}
        files: |
          dist/ProGlassAutomation-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ProGlassAutomation Build

on:
  push:
    branches:
      - new
  pull_request:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore ProGlassAutomation NuGet Packages
      shell: pwsh
      run: |
        dotnet restore "./ProGlassAutomation.csproj"

    - name: Publish ProGlassAutomation Standalone Binary
      shell: pwsh
      run: |
        dotnet publish "./ProGlassAutomation.csproj" `
          --configuration Release `
          --output publish `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=false `
          -p:DebugType=None `
          -p:DebugSymbols=false

    - name: Create Installer Payload
      shell: pwsh
      run: |
        if (Test-Path "Setup/ProGlassSetup/payload.zip") {
          Remove-Item "Setup/ProGlassSetup/payload.zip" -Force
        }

        Compress-Archive `
          -Path "publish/*" `
          -DestinationPath "Setup/ProGlassSetup/payload.zip" `
          -Force

        Get-Item "Setup/ProGlassSetup/payload.zip"

    - name: Restore ProGlassSetup NuGet Packages
      shell: pwsh
      run: |
        dotnet restore "./Setup/ProGlassSetup/ProGlassSetup.csproj"

    - name: Publish ProGlassSetup Installer
      shell: pwsh
      run: |
        dotnet publish "./Setup/ProGlassSetup/ProGlassSetup.csproj" `
          --configuration Release `
          --output setup_publish `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:PublishTrimmed=false `
          -p:DebugType=None `
          -p:DebugSymbols=false

    - name: Prepare Release Files
      shell: pwsh
      run: |
        if (Test-Path dist) {
          Remove-Item dist -Recurse -Force
        }

        New-Item -ItemType Directory -Path dist | Out-Null

        Copy-Item "publish/ProGlassAutomation.exe" "dist/ProGlassAutomation.exe" -Force
        Copy-Item "setup_publish/ProGlassSetup.exe" "dist/ProGlassSetup.exe" -Force

        Get-ChildItem dist

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProGlassAutomation-Setup-Package
        path: dist

    - name: Create GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: ProGlass Automation v1.0.${{ github.run_number }}
        generate_release_notes: true
        files: |
          dist/ProGlassAutomation.exe
          dist/ProGlassSetup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
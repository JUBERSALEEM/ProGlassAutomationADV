name: Appearance Theme Integration

on:
  push:
    branches:
      - ui-rewrite/nine-themes
  pull_request:
    branches:
      - ui-rewrite/nine-themes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-wpf-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF test project and application
        run: dotnet restore Tests/ProGlassAutomation.Tests.csproj

      - name: Run Appearance nine-family acceptance tests
        run: dotnet test Tests/ProGlassAutomation.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~AppearanceThemeIntegrationTests" --results-directory Tests/TestResults --logger "trx;LogFileName=appearance-theme.trx"

      - name: Run complete Windows test suite
        run: dotnet test Tests/ProGlassAutomation.Tests.csproj --configuration Release --no-restore --results-directory Tests/TestResults --logger "trx;LogFileName=full-suite.trx"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-theme-test-reports
          path: Tests/TestResults/*.trx
          if-no-files-found: ignore
